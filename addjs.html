<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการสินค้า - GitHub Pages Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <script src="product.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Sarabun', sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr 1fr 100px 120px; gap: 12px; margin-bottom: 25px; background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid #dee2e6; }
        input { padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; width: 100%; font-family: 'Sarabun'; font-size: 15px; }
        #newCode { text-transform: uppercase; font-weight: bold; }

        button { cursor: pointer; border: none; padding: 10px 15px; border-radius: 6px; font-family: 'Sarabun'; font-weight: bold; transition: 0.2s; }
        .btn-add { background: #2ecc71; color: white; }
        .btn-del { background: #ff7675; color: white; padding: 5px 12px; font-size: 0.85em; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #4a5568; color: white; }
        tr:nth-child(even) { background-color: #f7fafc; }

        .code-area { margin-top: 35px; position: relative; }
        textarea { 
            width: 100%; height: 350px; padding: 20px; 
            background: #1a202c; color: #a0aec0; 
            font-family: 'Consolas', 'Monaco', monospace; font-size: 13px;
            border-radius: 8px; border: none; white-space: pre; line-height: 1.7;
        }
        .action-btns { display: flex; gap: 10px; margin-bottom: 10px; justify-content: flex-end; }
        .btn-copy { background: #4299e1; color: white; }
        .btn-download { background: #e67e22; color: white; }
        .hint { color: #718096; font-size: 0.85em; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛠️ ระบบจัดการฐานข้อมูลสินค้า (GitHub Pages)</h2>
    
    <div class="form-group">
        <input id="newCode" placeholder="รหัส" oninput="this.value = this.value.toUpperCase()">
        <input id="newFact" placeholder="โรงงาน">
        <input id="newName" placeholder="ชื่อสินค้า">
        <input id="newUnit" placeholder="หน่วย">
        <button class="btn-add" onclick="addProduct()">+ เพิ่มสินค้า</button>
    </div>

    <h3>📦 รายการสินค้าปัจจุบัน</h3>
    <div style="max-height: 250px; overflow-y: auto; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
        <table>
            <thead>
                <tr>
                    <th width="15%">รหัส</th><th width="20%">โรงงาน</th><th>ชื่อสินค้า</th><th width="12%">หน่วย</th><th width="10%">จัดการ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="code-area">
        <h3>📄 ผลลัพธ์ไฟล์ product.js</h3>
        <div class="action-btns">
            <button class="btn-copy" onclick="copyCode()">📄 Copy Code</button>
            <button class="btn-download" onclick="downloadJS()">💾 ดาวน์โหลดไฟล์ .js</button>
        </div>
        <textarea id="outputCode" readonly spellcheck="false"></textarea>
    </div>
</div>

<script>
    let currentData = typeof products !== 'undefined' ? products : [];
    sortAndRender();

    function addProduct() {
        const code = document.getElementById('newCode').value.trim().toUpperCase();
        const fact = document.getElementById('newFact').value.trim();
        const name = document.getElementById('newName').value.trim();
        const unt = document.getElementById('newUnit').value.trim();
        if(!code || !name) return alert("กรุณากรอกรหัสและชื่อสินค้า");
        currentData.push({ code, fact, name, unt });
        document.getElementById('newCode').value = '';
        document.getElementById('newFact').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newUnit').value = '';
        sortAndRender();
    }

    function deleteItem(index) {
        if(confirm('ลบรายการนี้ใช่หรือไม่?')) {
            currentData.splice(index, 1);
            sortAndRender();
        }
    }

    function sortAndRender() {
        currentData.sort((a, b) => a.code.localeCompare(b.code, undefined, {numeric: true, sensitivity: 'base'}));
        renderTable();
        updateCodeBox();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        currentData.forEach((p, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${p.code}</b></td><td>${p.fact}</td><td>${p.name}</td><td>${p.unt}</td>
                <td style="text-align:center;"><button class="btn-del" onclick="deleteItem(${index})">ลบ</button></td>`;
            tbody.appendChild(tr);
        });
    }

    function updateCodeBox() {
        let txt = "const products = [\n";
        currentData.forEach((item, index) => {
            txt += `    { code: "${item.code}", fact: "${item.fact}", name: "${item.name}", unt: "${item.unt}" }${(index < currentData.length - 1) ? ",\n" : "\n"}`;
        });
        txt += "];";
        document.getElementById('outputCode').value = txt;
    }

    function copyCode() {
        const copyText = document.getElementById("outputCode");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("ก๊อปปี้โค้ดแล้ว!");
    }

    function downloadJS() {
        const text = document.getElementById("outputCode").value;
        const blob = new Blob([text], { type: "text/javascript" });
        const anchor = document.createElement("a");
        anchor.download = "product.js";
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
        alert("ดาวน์โหลดไฟล์แล้ว! นำไปอัปโหลดขึ้น GitHub แทนที่ไฟล์เดิมได้เลย");
    }
</script>
</body>
</html>
